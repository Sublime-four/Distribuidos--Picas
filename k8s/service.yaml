# Expone el pod fuera del clúster en el puerto 30080 de cada nodo.
# En Killercoda: menú "Traffic / Ports" -> puerto 30080.
apiVersion: v1
kind: Service
metadata:
  name: picas-fijas
  labels:
    app: picas-fijas
spec:
  type: NodePort
  selector:
    app: picas-fijas
  ports:
    - name: http
      port: 80          # puerto del Service dentro del clúster
      targetPort: http  # puerto 8080 del contenedor
      nodePort: 30080   # puerto abierto en los nodos
