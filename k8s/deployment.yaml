apiVersion: apps/v1
kind: Deployment
metadata:
  name: picas-fijas
  labels:
    app: picas-fijas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: picas-fijas
  template:
    metadata:
      labels:
        app: picas-fijas
    spec:
      containers:
        - name: picas-fijas
          image: docker.io/TU_USUARIO/picas-fijas:1.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
